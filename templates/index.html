<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance | Scanner Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #090d16; 
            --panel: #111827; 
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent: #2563eb; 
            --accent-glow: rgba(37, 99, 235, 0.3);
            --text: #f9fafb; 
            --muted: #9ca3af; 
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 70%);
        }
        
        /* Enterprise Header */
        header { 
            background: rgba(17, 24, 39, 0.8); 
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border); 
            padding: 0 40px; 
            height: 75px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand { font-size: 17px; font-weight: 600; letter-spacing: 0.5px; color: var(--text); display: flex; align-items: center; gap: 12px; }
        .brand-icon { background: rgba(37, 99, 235, 0.15); padding: 8px; border-radius: 10px; color: #60a5fa; display: flex; }
        
        .nav-menu { display: flex; gap: 10px; }
        .nav-menu a { 
            color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; 
            padding: 8px 16px; border-radius: 8px; transition: all 0.2s ease;
        }
        .nav-menu a:hover { color: var(--text); background: rgba(255, 255, 255, 0.03); }
        .nav-menu a.active { color: #ffffff; background: var(--accent); box-shadow: 0 4px 12px var(--accent-glow); }

        /* Main Content Layout */
        .main-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        .terminal-card { 
            background: var(--panel); 
            width: 100%; 
            max-width: 540px; 
            padding: 40px; 
            border-radius: 20px; 
            border: 1px solid var(--panel-border); 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
        }
        
        .header-text { text-align: center; margin-bottom: 30px; }
        .header-text h2 { font-weight: 600; font-size: 22px; margin-bottom: 8px; letter-spacing: -0.3px; }
        .header-text p { color: var(--muted); font-size: 14px; }

        /* Video Frame Styling */
        .video-container {
            width: 100%; 
            aspect-ratio: 4/3; 
            background: #030712; 
            border-radius: 14px; 
            border: 1px solid var(--panel-border); 
            display: flex; 
            justify-content: center; 
            align-items: center;
            overflow: hidden; 
            position: relative; 
            margin-bottom: 24px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.6);
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: none; }
        
        .standby-mode { text-align: center; color: var(--muted); }
        .standby-icon { width: 56px; height: 56px; margin: 0 auto 12px auto; background: rgba(255,255,255,0.03); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--muted); }
        .standby-mode p { font-size: 14px; font-weight: 500; }
        
        /* Action Button */
        .btn-primary {
            width: 100%; 
            background: linear-gradient(135deg, #2563eb, #1d4ed8); 
            color: white; 
            border: none; 
            padding: 15px;
            font-size: 15px; 
            font-weight: 600; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px var(--accent-glow); background: linear-gradient(135deg, #3b82f6, #2563eb); }
        
        .status-bar { 
            margin-top: 20px; 
            padding: 14px 18px; 
            border-radius: 10px; 
            font-size: 13px; 
            font-weight: 600;
            text-align: center; 
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid var(--panel-border); 
            display: none;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
            </div>
            FUTMINNA Student Biometric System
        </div>
        <div class="nav-menu">
            <a href="/" class="active">Scanner Terminal</a>
            <a href="/register">Student Enrollment</a>
            <a href="/admin">Attendance Logs</a>
        </div>
    </header>

    <div class="main-container">
        <div class="terminal-card">
            <div class="header-text">
                <h2>Facial Authentication</h2>
                <p>Position student face clearly within the optical frame</p>
            </div>

            <div class="video-container" id="videoContainer">
                <div class="standby-mode" id="standbyUI">
                    <div class="standby-icon">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </div>
                    <p>Camera Standby</p>
                </div>
                <video id="videoElement" autoplay playsinline></video>
            </div>
            
            <canvas id="canvas" style="display:none;"></canvas>
            
            <button class="btn-primary" id="startBtn" onclick="activateScanner()">Activate Scanner Terminal</button>
            <div id="statusText" class="status-bar"></div>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');
        const startBtn = document.getElementById('startBtn');
        const standbyUI = document.getElementById('standbyUI');

        function activateScanner() {
            startBtn.innerHTML = "Initializing Camera Feed...";
            startBtn.disabled = true;

            navigator.mediaDevices.getUserMedia({ video: true })
                .then(function(stream) {
                    standbyUI.style.display = 'none';
                    video.style.display = 'block';
                    startBtn.style.display = 'none';
                    
                    video.srcObject = stream;
                    statusText.style.display = 'block';
                    statusText.innerText = "System Active: Scanning for registered students...";
                    statusText.style.color = "#60a5fa";

                    setInterval(() => {
                        if (video.videoWidth > 0) {
                            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                            
                            fetch('/api/scan', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ image: canvas.toDataURL('image/jpeg') })
                            })
                            .then(res => res.json())
                            .then(data => {
                                statusText.innerText = data.message;
                                if (data.status === "success") statusText.style.color = "#10b981";
                                else if (data.status === "warning") statusText.style.color = "#f59e0b";
                                else if (data.status === "unknown") statusText.style.color = "#ef4444";
                                else statusText.style.color = "#9ca3af";
                            });
                        }
                    }, 1500); 
                })
                .catch(function(error) {
                    startBtn.innerHTML = "Hardware Access Denied";
                    statusText.style.display = 'block';
                    statusText.innerText = "Error: Please permit camera access in your browser settings.";
                    statusText.style.color = "#ef4444";
                });
        }
    </script>
</body>
</html>
