<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Security | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #090d16; --panel: #111827; --accent: #2563eb; --text: #f9fafb; --border: rgba(255, 255, 255, 0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { 
            background-color: var(--bg); color: var(--text); min-height: 100vh; 
            display: flex; justify-content: center; align-items: center;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 70%);
        }
        .login-card {
            background: var(--panel); width: 100%; max-width: 400px; padding: 40px; 
            border-radius: 20px; border: 1px solid var(--border); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .icon { background: rgba(37, 99, 235, 0.15); color: #60a5fa; width: 60px; height: 60px; border-radius: 15px; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px auto; }
        h2 { font-weight: 600; margin-bottom: 8px; }
        p { color: #9ca3af; font-size: 14px; margin-bottom: 30px; }
        
        .form-control { 
            width: 100%; background: #030712; border: 1px solid var(--border); color: white;
            padding: 14px; border-radius: 10px; font-size: 14px; margin-bottom: 15px; text-align: left;
        }
        .form-control:focus { outline: none; border-color: var(--accent); }
        
        .btn-primary {
            width: 100%; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; 
            padding: 15px; font-size: 15px; font-weight: 600; border-radius: 10px; cursor: pointer; margin-top: 10px;
        }
        .btn-primary:hover { filter: brightness(1.1); }
        
        .error-msg { background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; border: 1px solid rgba(239, 68, 68, 0.3); }
        .back-link { display: inline-block; margin-top: 20px; color: #9ca3af; text-decoration: none; font-size: 13px; transition: 0.2s; }
        .back-link:hover { color: white; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="icon">
            <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <h2>Admin Authentication</h2>
        <p>Restricted Area. Enter credentials to proceed.</p>
        
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="/login">
            <input type="text" name="username" class="form-control" placeholder="Admin Username" required autocomplete="off">
            <input type="password" name="password" class="form-control" placeholder="Admin Password" required>
            <button type="submit" class="btn-primary">Authenticate Identity</button>
        </form>
        <a href="/" class="back-link">← Return to Scanner Terminal</a>
    </div>
</body>
</html>
